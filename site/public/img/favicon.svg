  <rect width="160" height="160" rx="34" fill="url(#bg)" />

  <!-- Source A card -->
  <rect x="26" y="30" width="72" height="76" rx="12" fill="#0F172A" stroke="url(#gridCyan)" stroke-width="4" />
  <rect x="38" y="20" width="8" height="14" rx="4" fill="#38BDF8" />
  <rect x="74" y="20" width="8" height="14" rx="4" fill="#38BDF8" />

  <!-- Source B card -->
