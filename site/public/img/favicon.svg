  <rect x="74" y="44" width="8" height="14" rx="4" fill="#F43F5E" />
  <rect x="110" y="44" width="8" height="14" rx="4" fill="#F43F5E" />

  <!-- Sync node -->
  <circle cx="80" cy="80" r="21" fill="#0B0F19" stroke="#22D3EE" stroke-width="3" />
  <circle cx="80" cy="80" r="6" fill="#FFFFFF" />
