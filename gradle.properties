org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 makes Kotlin support built-in and deprecates the standalone
# org.jetbrains.kotlin.android plugin this project still uses. Opting out for
# now keeps the familiar KGP setup; AGP 10.0 will remove this escape hatch, so
# plan a real migration (see developer.android.com/build/migrate-to-built-in-kotlin)
# before upgrading past AGP 9.x.
android.builtInKotlin=false
android.newDsl=false
